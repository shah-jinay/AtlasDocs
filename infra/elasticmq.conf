// ElasticMQ config: an SQS-API-compatible broker used only for local
// development (blueprint section 18.2). Predefines the ingestion queue and
// its DLQ so the stack is ready immediately; app.queue.sqs.ensure_queues()
// is a defensive fallback if this file's queues are ever missing.
include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    atlasdocs-ingestion-dlq {
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
    atlasdocs-ingestion {
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        receiveMessageWait = 10 seconds
        deadLettersQueue {
            name = "atlasdocs-ingestion-dlq"
            maxReceiveCount = 5
        }
    }
}

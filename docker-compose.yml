# AtlasDocs local stack (blueprint section 18.2, adapted to be fully
# self-contained). MinIO stands in for S3 and ElasticMQ stands in for SQS --
# both are accessed through the same boto3 adapters (app.storage.s3,
# app.queue.sqs) that would point at real AWS in production, so nothing in
# app code is "local-only."
#
# Quick start:
#   docker compose up -d --build
#   open http://localhost:5173         # frontend
#   curl http://localhost:8000/health  # api
#
# Dev auth: the API accepts `Authorization: Bearer dev-key-alice` (or
# dev-key-bob) out of the box -- see backend/app/core/security.py.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: atlasdocs
      POSTGRES_PASSWORD: atlasdocs
      POSTGRES_DB: atlasdocs
    ports: ["5432:5432"]
    volumes:
      - atlasdocs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlasdocs
      MINIO_ROOT_PASSWORD: atlasdocs-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - atlasdocs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:1.5.7
    ports: ["9324:9324", "9325:9325"]
    volumes:
      - ./infra/elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://atlasdocs:atlasdocs@postgres:5432/atlasdocs
      S3_ENDPOINT_URL: http://minio:9000
      # Presigned URLs are followed by the browser/host, not this
      # container, so they must point at the host-published port instead
      # of the docker-network hostname (see app/storage/s3.py).
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/queue/atlasdocs-ingestion
      SQS_DLQ_URL: http://elasticmq:9324/queue/atlasdocs-ingestion-dlq
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      elasticmq: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://atlasdocs:atlasdocs@postgres:5432/atlasdocs
      S3_ENDPOINT_URL: http://minio:9000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/queue/atlasdocs-ingestion
      SQS_DLQ_URL: http://elasticmq:9324/queue/atlasdocs-ingestion-dlq
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      elasticmq: { condition: service_started }
      api: { condition: service_started }
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_started }

volumes:
  atlasdocs_pg_data:
  atlasdocs_minio_data:
